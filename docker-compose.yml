services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ditado
      POSTGRES_PASSWORD: ditado
      POSTGRES_DB: ditado
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3333:3333"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dados:
